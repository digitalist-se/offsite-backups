name: offsite-backups
type: php
docroot: ""
php_version: "8.3"
webserver_type: nginx-fpm
omit_containers: [db]
web_environment:
  - OFFSITE_BACKUP_TEST_S3_HOST=http://s3:7070
  - OFFSITE_BACKUP_TEST_S3_ACCESS_KEY=testkey
  - OFFSITE_BACKUP_TEST_S3_SECRET_KEY=testsecret12345
  - OFFSITE_BACKUP_TEST_RESTIC_BIN=/tmp/tools/restic
